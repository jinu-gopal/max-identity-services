spring.application.name=max-identity-service

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/max_erp
spring.datasource.username=maxadmin
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Temporary security diagnostics
logging.level.org.springframework.security=TRACE

# Temporary Hibernate SQL diagnostics
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE